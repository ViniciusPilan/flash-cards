categories:
- category: Kubernetes (Admin - CKA)
  questions:
  - question: What is the Kubernetes control plane?
    answer: 'The control plane manages the desired state of a Kubernetes cluster. Its main components include the API server, scheduler, controller managers, and etcd.


      As a Kubernetes administrator, you need to understand how these components interact. Control-plane availability and correct configuration are fundamental to cluster management and workload orchestration.'
  - question: What is etcd?
    answer: 'etcd is a distributed key-value store used by Kubernetes to persist cluster state and configuration. The Kubernetes API server uses it as the authoritative storage layer for cluster objects.


      Protecting etcd is critical because losing or corrupting its data can affect the entire cluster. Administrators should understand backups, recovery, security, and availability.'
  - question: What is the Kubernetes scheduler?
    answer: 'The scheduler selects an appropriate node for newly created pods that do not yet have an assigned node. It evaluates factors such as resource availability, constraints, affinity, taints, and tolerations.


      Understanding scheduling is essential when workloads remain pending. Administrators can diagnose scheduling decisions by examining pod events and resource or placement constraints.'
  - question: What is a Kubernetes controller?
    answer: 'A controller continuously observes cluster state and attempts to reconcile it with the desired state defined by Kubernetes resources.


      For example, a Deployment controller ensures the required number of ReplicaSets and pods exist. This reconciliation model is fundamental to Kubernetes and explains why manually changing resources can be automatically corrected.'
  - question: What is the difference between a node and a pod?
    answer: 'A node is a worker machine that provides compute resources for Kubernetes workloads. A pod is the smallest deployable Kubernetes unit and contains one or more containers sharing network and storage contexts.


      Administrators manage nodes as cluster infrastructure, while pods represent scheduled workloads. Understanding this hierarchy is essential for troubleshooting resource and scheduling problems.'
  - question: What are taints and tolerations?
    answer: 'A taint marks a node so that pods are prevented from being scheduled there unless they have a matching toleration. Taints therefore influence which workloads can run on specific nodes.


      Administrators can use taints to reserve nodes for particular workloads, isolate special-purpose nodes, or control scheduling during maintenance and operational conditions.'
  - question: What is a Kubernetes Service?
    answer: 'A Service provides a stable network abstraction for accessing a set of pods selected by labels. It decouples clients from individual pod IP addresses, which are ephemeral.


      Service types such as ClusterIP, NodePort, and LoadBalancer provide different exposure models. Understanding Services is fundamental for Kubernetes networking and application availability.'
  - question: How should a Kubernetes cluster be backed up?
    answer: 'A Kubernetes backup strategy should protect critical cluster state and application data rather than relying only on pod recreation. etcd state is particularly important for recovering Kubernetes objects.


      Administrators should define backup frequency, retention, security, and recovery procedures and test restoration regularly. A backup that has never been restored should not be assumed to be reliable.'
- category: Kubernetes (Dev/User - CKAD)
  questions:
  - question: What is a Pod in Kubernetes?
    answer: 'A Pod is the smallest deployable unit in Kubernetes and represents one or more containers that share network and storage contexts. Containers in the same pod are scheduled together on the same node.


      Most applications use one main container per pod, while sidecars can provide supporting functionality. Developers should design pods around tightly coupled processes that must share lifecycle and resources.'
  - question: What is a Deployment?
    answer: 'A Deployment manages a set of replicated pods and provides declarative updates for application workloads. It creates and manages ReplicaSets to maintain the desired number of pods.


      Deployments support rolling updates and rollback mechanisms, making them a common abstraction for stateless applications. Developers should generally modify the Deployment rather than individual pods.'
  - question: What is a ConfigMap?
    answer: 'A ConfigMap stores non-sensitive configuration data separately from container images. Applications can consume ConfigMap values through environment variables, command arguments, or mounted files.


      This separation allows the same image to be reused across environments. ConfigMaps should not be used for passwords, tokens, or other sensitive information.'
  - question: What is a Kubernetes Secret?
    answer: 'A Secret is a Kubernetes resource designed to hold sensitive configuration such as credentials, tokens, or certificates. Applications can consume secrets through environment variables or mounted files.


      Secrets still require appropriate protection because their storage and access depend on cluster configuration. Developers should use RBAC and external secret-management solutions when stronger controls are required.'
  - question: What are resource requests and limits?
    answer: 'A resource request indicates the amount of CPU or memory a container expects and influences scheduling. A limit defines the maximum amount the container can consume for the specified resource.


      Correct values help Kubernetes schedule workloads predictably and prevent individual containers from consuming excessive resources. Poor limits can cause throttling or memory-related termination.'
  - question: What is a liveness probe?
    answer: 'A liveness probe determines whether a container is still functioning correctly. If Kubernetes determines that the container is unhealthy according to the probe configuration, it can restart the container.


      Liveness probes should detect conditions where restarting can actually recover the application. Poorly designed probes can cause unnecessary restart loops during temporary failures.'
  - question: What is a readiness probe?
    answer: 'A readiness probe determines whether a container is ready to receive traffic. Kubernetes can remove a pod from Service endpoints when its readiness check fails.


      Readiness is especially important during startup, rolling deployments, and temporary dependency failures. It prevents traffic from being sent to an application that is running but not ready.'
  - question: What is a Kubernetes namespace?
    answer: 'A namespace provides a logical boundary for organizing Kubernetes resources within a cluster. It can be used to separate teams, applications, environments, or administrative domains.


      Namespaces also work with mechanisms such as RBAC, resource quotas, and network policies. They provide organization and control but should not automatically be considered a complete security boundary.'
- category: Kubernetes (Admin/Sec Engineer - CKS)
  questions:
  - question: What is Kubernetes RBAC?
    answer: 'Role-Based Access Control regulates which identities can perform which actions on Kubernetes resources. Permissions are defined through Roles or ClusterRoles and assigned using bindings.


      CKS-level security requires applying least privilege. Avoid broad permissions such as unrestricted cluster administration when a workload or user only needs access to specific resources.'
  - question: What is a Kubernetes security context?
    answer: 'A security context defines security-related settings for pods and containers, including user IDs, privilege settings, capabilities, filesystem behavior, and other controls.


      Security contexts allow administrators to reduce container privileges and enforce safer runtime behavior. Workloads should run with the minimum permissions required for their function.'
  - question: What is a privileged container?
    answer: 'A privileged container receives extensive access to host-level capabilities and devices, significantly weakening normal container isolation.


      Privileged containers should be avoided unless there is a strong operational requirement. From a security perspective, unnecessary privileges can increase the impact of a compromised workload.'
  - question: What is a Kubernetes NetworkPolicy?
    answer: 'A NetworkPolicy defines rules controlling network communication between pods and, depending on the implementation, external endpoints.


      Network policies support a defense-in-depth approach by restricting unnecessary east-west traffic. A secure design typically begins with clearly defined communication requirements rather than allowing unrestricted connectivity.'
  - question: What is Pod Security Admission?
    answer: 'Pod Security Admission is a Kubernetes mechanism that evaluates pods against Pod Security Standards. It can enforce security profiles such as privileged, baseline, and restricted.


      Administrators can use it to prevent workloads from violating defined security expectations. It provides a built-in policy enforcement mechanism for pod-level security.'
  - question: Why should container images run as non-root?
    answer: 'Running as a non-root user limits the privileges available to an application if the container is compromised. Root inside a container can increase the potential impact of vulnerabilities.


      Security-focused Kubernetes deployments should explicitly define non-root execution where possible. This should be combined with other controls such as capabilities, filesystem restrictions, and seccomp.'
  - question: What is seccomp?
    answer: 'Seccomp is a Linux security mechanism that restricts the system calls a process can make. Kubernetes can use seccomp profiles to limit container access to unnecessary kernel functionality.


      Reducing available system calls can decrease the attack surface of a workload. Security engineers should understand appropriate profiles and avoid disabling protections without a justified requirement.'
  - question: What is Kubernetes audit logging?
    answer: 'Kubernetes audit logging records information about requests made to the Kubernetes API, including details about users, resources, operations, and outcomes.


      Audit logs support security investigations, compliance, and detection of suspicious administrative activity. They should be collected, protected, retained, and monitored according to organizational requirements.'
- category: DevOps core tools
  questions:
  - question: Why is Git fundamental to DevOps?
    answer: 'Git provides distributed version control for tracking changes to source code, configuration, infrastructure, and automation. It supports collaboration through branches, commits, merges, and pull requests.


      For DevOps Engineers, Git often acts as the foundation of GitOps and CI/CD workflows. Infrastructure and deployment configuration can be reviewed and changed using the same controlled process as application code.'
  - question: What is Docker used for?
    answer: 'Docker provides tooling for building, packaging, distributing, and running containerized applications. It uses container images as reproducible application artifacts.


      DevOps Engineers use Docker extensively in development, CI pipelines, and application packaging. Understanding images, registries, volumes, networking, and container lifecycle is fundamental to container-based workflows.'
  - question: What is Helm?
    answer: 'Helm is a package manager for Kubernetes that uses charts to define reusable Kubernetes application configurations. Charts can contain templates, metadata, dependencies, and configurable values.


      Helm simplifies deploying complex applications consistently across environments. DevOps Engineers commonly use it for platform components and application releases while managing configuration through version control.'
  - question: What is GitHub Actions?
    answer: 'GitHub Actions is a CI/CD automation platform integrated with GitHub repositories. Workflows are defined as configuration files and can execute builds, tests, security checks, packaging, and deployments.


      It enables teams to automate software delivery close to the source repository. DevOps Engineers should design workflows with secure credentials, reusable actions, controlled permissions, and reliable artifact handling.'
  - question: What is Ansible?
    answer: 'Ansible is an automation and configuration-management tool that uses declarative-style playbooks to describe tasks and desired system configuration. It commonly connects to systems remotely without requiring an agent.


      DevOps Engineers use Ansible for server configuration, application deployment, operational automation, and orchestration. It is particularly useful when procedural automation and configuration management are required.'
  - question: What is Prometheus?
    answer: 'Prometheus is a monitoring system designed around time-series metrics and a powerful query language called PromQL. It commonly collects metrics by scraping configured endpoints.


      DevOps Engineers use Prometheus for monitoring, alerting, troubleshooting, and Kubernetes observability. Its label-based data model is powerful but requires careful control of metric cardinality.'
  - question: What is Grafana?
    answer: 'Grafana is an observability and visualization platform used to query, visualize, and correlate data from many sources. It supports dashboards, alerts, and exploration of metrics, logs, and traces.


      In DevOps environments, Grafana is commonly used to provide operational visibility. Good dashboards should focus on meaningful service and infrastructure signals rather than simply displaying large numbers of metrics.'
  - question: What is Argo CD?
    answer: 'Argo CD is a Kubernetes-focused GitOps continuous delivery tool that continuously compares the desired state stored in Git with the state running in a cluster.


      When differences are detected, Argo CD can synchronize the cluster toward the declared configuration. This model makes Git a central source of truth for Kubernetes deployments and improves deployment consistency and auditability.'
