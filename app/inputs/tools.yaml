categories:
- category: Kubernetes (Admin - CKA)
  questions:
  - question: What is the role of the Kubernetes control plane?
    answer: 'The control plane manages the desired state of the cluster. The API server exposes the Kubernetes API, the scheduler assigns Pods to nodes, the controller manager reconciles resources, and etcd stores cluster state.


      For a DevOps Engineer, understanding these responsibilities helps diagnose failures. A scheduling problem, API problem, and node problem originate in different control-plane or worker components.'
  - question: How does Kubernetes scheduling work?
    answer: 'The scheduler selects a suitable node for each unscheduled Pod by evaluating constraints such as resource requests, node selectors, affinity, taints, and tolerations. It then assigns the Pod to the selected node.


      The scheduler does not run containers itself. It makes placement decisions, while the kubelet on the selected node communicates with the container runtime to create and manage the workload.'
  - question: What is the purpose of etcd in Kubernetes?
    answer: 'etcd is Kubernetes'' distributed key-value store and contains the cluster''s authoritative state. Kubernetes resources such as Deployments, Services, Secrets, and configuration objects are persisted there.


      Because etcd is critical to cluster recovery, administrators must protect it with authentication, encryption, backups, and reliable storage. Losing etcd without a valid backup can mean losing the cluster''s desired state.'
  - question: What is the difference between a Deployment and a StatefulSet?
    answer: 'A Deployment manages stateless workloads where Pods are generally interchangeable. Kubernetes can replace them with new Pods without requiring stable identities or persistent storage associations.


      A StatefulSet provides stable Pod identities, predictable ordering, and persistent storage associations. It is appropriate when applications require identity or ordered operations, such as databases and distributed systems.'
  - question: How do Kubernetes Services provide stable networking?
    answer: 'Pods are ephemeral and their IP addresses can change when they are recreated. A Service provides a stable virtual IP and DNS name that represents a group of Pods selected through labels.


      The Service therefore decouples clients from individual Pod instances. Kubernetes can update the backend endpoints as Pods are created, removed, or replaced without requiring clients to know their changing addresses.'
- category: Kubernetes (Dev/User - CKAD)
  questions:
  - question: What is the difference between a Pod and a container?
    answer: 'A container is an isolated process packaged with its application and dependencies. A Pod is the smallest deployable unit in Kubernetes and can contain one or more containers that share networking and storage.


      Most applications use one main container per Pod, while sidecars are useful when another container must closely cooperate with the application, such as a proxy or log collector.'
  - question: Why are Kubernetes resource requests and limits important?
    answer: 'Requests define how much CPU and memory a container expects to need and are primarily used by the scheduler when selecting a node. Limits define the maximum resources the container can consume.


      Correct values improve scheduling and workload isolation. Excessively low limits can cause throttling or OOM kills, while excessively high requests can waste cluster capacity and prevent efficient scheduling.'
  - question: What is the difference between ConfigMaps and Secrets?
    answer: 'ConfigMaps store non-sensitive configuration such as application settings, environment variables, or configuration files. Secrets are designed for sensitive values such as credentials, tokens, and certificates.


      Both can be consumed by Pods as environment variables or mounted files. However, Secrets should not be treated as automatically secure simply because they use a different resource type; access control and encryption at rest are still important.'
  - question: How do liveness and readiness probes differ?
    answer: 'A liveness probe determines whether a container should be restarted because it is unhealthy. A readiness probe determines whether the application is currently able to receive traffic.


      This distinction is important for highly available workloads. A temporarily overloaded application can fail readiness without being restarted, allowing Kubernetes to remove it from Service endpoints while it recovers.'
  - question: What problem do Deployments solve?
    answer: 'A Deployment manages the lifecycle of replicated stateless Pods and provides declarative updates and rollbacks. Instead of manually creating individual Pods, you describe the desired number of replicas and the container configuration.


      The Deployment controller continuously reconciles the actual state with that desired state. This makes application releases repeatable and allows Kubernetes to progressively replace old Pods with new versions.'
- category: Kubernetes (Admin/Sec Engineer - CKS)
  questions:
  - question: What does the principle of least privilege mean in Kubernetes?
    answer: 'Least privilege means granting workloads and users only the permissions they actually need. In Kubernetes, this applies to RBAC permissions, Linux capabilities, service accounts, network access, and filesystem permissions.


      For workloads, unnecessary privileges increase the impact of a compromise. A secure design therefore minimizes permissions, avoids privileged containers, uses dedicated service accounts, and restricts access to required resources.'
  - question: What is the purpose of Kubernetes RBAC?
    answer: 'RBAC controls which identities can perform which actions against Kubernetes resources. Roles define permissions, while RoleBindings or ClusterRoleBindings associate those permissions with users, groups, or service accounts.


      A secure cluster should avoid broad permissions such as unrestricted cluster administration. Permissions should be scoped to the smallest namespace and resource set required by the workload or operator.'
  - question: Why should containers avoid running as root?
    answer: 'Running a container as root increases the potential impact of a container compromise. If an attacker exploits the application, root privileges inside the container can provide additional opportunities for privilege escalation or interaction with the host.


      Security contexts can enforce non-root execution, read-only filesystems, dropped capabilities, and other restrictions. These controls reduce the attack surface even when an application vulnerability exists.'
  - question: What is the purpose of Pod Security Standards?
    answer: 'Pod Security Standards define security expectations for Kubernetes Pods through profiles such as Privileged, Baseline, and Restricted. They provide a consistent way to prevent dangerous workload configurations.


      The Restricted profile applies stronger controls, including restrictions around privileged containers, host namespaces, capabilities, and privilege escalation. Administrators can use these policies to establish security boundaries across namespaces.'
  - question: Why is network segmentation important in Kubernetes?
    answer: 'By default, Kubernetes networking can allow broad communication between Pods, depending on the networking implementation. NetworkPolicies provide rules that restrict ingress and egress traffic between workloads.


      Segmentation limits lateral movement after a compromise. A secure application should explicitly define which services need to communicate instead of assuming that every workload in the cluster should be reachable.'
- category: Docker
  questions:
  - question: What is the difference between a container and an image?
    answer: 'A Docker image is an immutable package containing the filesystem layers and metadata required to create a container. A container is a runtime instance created from an image.


      Images provide reproducibility because the same image can be deployed across environments. Containers add runtime state and isolation around the application process while sharing the host kernel.'
  - question: Why are Docker images built in layers?
    answer: 'Docker images are composed of filesystem layers created by image-building instructions. Layers can be reused between images, which reduces storage requirements and improves build performance.


      Understanding layers also helps optimize Dockerfiles. Stable dependencies should generally be placed in reusable layers, while frequently changing application content can be placed later to maximize build-cache effectiveness.'
  - question: What is the purpose of a Dockerfile?
    answer: 'A Dockerfile defines how an image should be built. It describes the base image, dependencies, files, environment variables, exposed ports, and command used to start the application.


      For DevOps workflows, Dockerfiles provide a reproducible and version-controlled way to create application artifacts. Good Dockerfiles also minimize image size, reduce unnecessary packages, and avoid embedding secrets.'
  - question: What is the difference between CMD and ENTRYPOINT?
    answer: 'ENTRYPOINT defines the primary executable that a container is intended to run, while CMD provides default arguments or a default command. Their behavior also depends on whether the Dockerfile uses shell or exec syntax.


      A common pattern is to use ENTRYPOINT for the application''s executable and CMD for default arguments. This allows users to override parameters without replacing the application''s main executable.'
  - question: Why should containers be treated as ephemeral?
    answer: 'Containers are designed to be replaceable instances rather than permanent servers. Their lifecycle can end because of deployments, failures, scaling, or node replacement.


      Persistent application data should therefore be stored outside the container''s writable layer, using volumes or external storage when appropriate. This design makes workloads easier to recreate, scale, and recover.'
- category: AWS
  questions:
  - question: What is the AWS shared responsibility model?
    answer: 'The shared responsibility model defines which security responsibilities belong to AWS and which belong to the customer. AWS secures the underlying cloud infrastructure, while customers remain responsible for areas such as identities, data, configurations, and workloads.


      The exact responsibilities depend on the service. Using a managed service does not eliminate security responsibilities; it changes which infrastructure layers AWS operates on the customer''s behalf.'
  - question: What is the principle of least privilege in AWS IAM?
    answer: 'IAM least privilege means granting identities only the permissions required to perform their responsibilities. Permissions should be scoped to specific actions, resources, and conditions whenever practical.


      This reduces the potential impact of compromised credentials or workloads. In DevOps environments, roles and temporary credentials are generally preferable to distributing long-lived access keys.'
  - question: What is the difference between an Availability Zone and a Region?
    answer: 'An AWS Region is a geographic area containing multiple isolated Availability Zones. An Availability Zone is an independent infrastructure location designed to provide isolation from failures in other zones within the Region.


      Deploying workloads across multiple Availability Zones improves availability because a failure affecting one zone does not necessarily take down the entire application.'
  - question: What is the purpose of a VPC?
    answer: 'A VPC provides an isolated virtual network in AWS where resources such as EC2 instances, load balancers, and managed services can communicate through controlled networking.


      It contains components such as subnets, route tables, security groups, and network ACLs. Proper VPC design establishes network boundaries and controls how workloads communicate with internal and external systems.'
  - question: What is the difference between Security Groups and Network ACLs?
    answer: 'Security Groups are stateful virtual firewalls associated with resources such as network interfaces. They control allowed inbound and outbound traffic and automatically account for return traffic.


      Network ACLs operate at the subnet level and are stateless, meaning return traffic must be explicitly allowed. Security Groups are commonly used for workload-level access control, while ACLs can provide an additional subnet boundary.'
- category: Istio
  questions:
  - question: What problem does a service mesh solve?
    answer: 'A service mesh provides a dedicated infrastructure layer for managing communication between services. It can centralize capabilities such as traffic management, encryption, telemetry, retries, and authorization.


      Instead of implementing these concerns independently in every application, the mesh handles them through proxies and control-plane configuration. This allows application teams to focus more on business logic.'
  - question: What is the role of the Istio data plane?
    answer: 'The data plane handles the actual traffic flowing between workloads. In Istio, this functionality is primarily provided by Envoy proxies deployed alongside application workloads.


      The proxies can enforce traffic policies, establish mTLS connections, collect telemetry, and perform routing behavior. The Istio control plane configures these proxies but does not directly proxy application traffic.'
  - question: What is mTLS and why is it useful in Istio?
    answer: 'Mutual TLS encrypts communication while also authenticating both sides of a connection. Unlike standard TLS, both the client and server prove their identities using certificates.


      Istio can automate certificate issuance, rotation, and workload identity management. This allows services to communicate securely without requiring every application to implement its own certificate-management logic.'
  - question: What are VirtualServices and DestinationRules?
    answer: 'A VirtualService defines how traffic is routed to services, including rules based on hosts, paths, headers, or other request properties. It can support patterns such as canary deployments and traffic splitting.


      A DestinationRule defines policies applied to traffic after routing, including subsets, load-balancing behavior, and connection settings. Together, they provide fine-grained traffic management.'
  - question: What is the purpose of Istio gateways?
    answer: 'Istio Gateways define how traffic enters or leaves the mesh at the network boundary. They provide a controlled point where external traffic can be exposed and associated with routing configuration.


      An ingress gateway typically receives traffic from outside the cluster and forwards it to internal services. This separates edge traffic handling from application workloads and allows centralized security and routing policies.'
- category: Prometheus
  questions:
  - question: What is the Prometheus data model?
    answer: 'Prometheus stores metrics as time series identified by a metric name and a set of labels. Each time series contains timestamped numeric samples representing the value of that metric over time.


      Labels make metrics multidimensional and allow queries to select subsets of data. However, excessive or unbounded label cardinality can significantly increase memory and storage consumption.'
  - question: What is the difference between metrics and logs?
    answer: 'Metrics represent numerical measurements over time, such as request rate, latency, CPU usage, or error counts. They are efficient for aggregation and detecting trends or conditions.


      Logs contain discrete records of events and usually provide more contextual detail. In observability systems, metrics can indicate that something is wrong, while logs can help explain specific events related to the problem.'
  - question: What is PromQL?
    answer: 'PromQL is Prometheus'' query language for selecting, filtering, aggregating, and calculating values from time-series data. It can combine metrics using operators and functions to produce useful operational information.


      For example, engineers can calculate request rates, error percentages, or resource utilization rather than relying only on raw metrics. PromQL is therefore fundamental for dashboards and alerting.'
  - question: What is the difference between counters and gauges?
    answer: 'A counter represents a value that generally increases over time, such as the number of HTTP requests or errors. It can reset when the process restarts, and functions such as rate can calculate its change over time.


      A gauge represents a value that can increase or decrease, such as memory usage, queue depth, or temperature. Choosing the correct metric type is important for producing meaningful queries and alerts.'
  - question: What makes a good Prometheus alert?
    answer: 'A good alert represents an actionable condition rather than simply detecting that a metric changed. It should identify a situation that requires human or automated intervention and provide enough context to investigate it.


      Alerts should also account for duration and normal operational behavior. For example, alerting on sustained high error rates is generally more useful than triggering on a brief, harmless spike.'
- category: Karpenter
  questions:
  - question: What problem does Karpenter solve?
    answer: 'Karpenter dynamically provisions compute capacity based on unschedulable Kubernetes Pods. Instead of relying only on predefined node groups, it evaluates workload requirements and selects suitable infrastructure.


      This allows clusters to respond more flexibly to changing workloads. Karpenter can provision nodes with different instance types and capacity characteristics while optimizing for scheduling requirements and cost.'
  - question: How does Karpenter decide which nodes to provision?
    answer: 'Karpenter observes Pods that cannot currently be scheduled and evaluates their resource requests and scheduling constraints. It then determines what node capacity can satisfy those requirements.


      Constraints can include CPU, memory, architecture, zones, instance characteristics, taints, and other scheduling requirements. The resulting node is selected to satisfy the workload while considering available capacity options.'
  - question: How is Karpenter different from Kubernetes Cluster Autoscaler?
    answer: 'Cluster Autoscaler generally adjusts the size of existing node groups based on pending Pods. Karpenter can provision nodes directly and choose from a broader set of instance types and characteristics.


      This gives Karpenter more flexibility in heterogeneous environments. The choice depends on the infrastructure model, operational requirements, and whether predefined node groups or dynamic provisioning better fit the platform.'
  - question: Why are Pod resource requests important for Karpenter?
    answer: 'Karpenter uses Pod scheduling requirements to determine what capacity is necessary. CPU and memory requests therefore provide important information about the capacity required to place workloads.


      If requests are inaccurate, provisioning decisions can also become inefficient. Underestimated requests can lead to resource pressure, while excessive requests can cause unnecessary node provisioning and increased infrastructure cost.'
  - question: How does Karpenter help optimize cloud costs?
    answer: 'Karpenter can select appropriate instance types based on workload requirements instead of forcing workloads into a fixed node-group structure. It can therefore take advantage of different capacity options and more efficient instance configurations.


      It can also consolidate workloads when possible, reducing unused capacity. Cost optimization should still consider availability, interruption risk, workload constraints, and performance rather than selecting infrastructure based only on price.'
- category: ArgoCD
  questions:
  - question: What is GitOps and how does ArgoCD implement it?
    answer: 'GitOps uses Git as the source of truth for declarative infrastructure and application configuration. Desired state is stored in version control, while automation continuously reconciles the environment with that state.


      ArgoCD implements this model for Kubernetes by comparing the desired manifests in Git with the live cluster state. It can detect differences and synchronize the cluster to the declared configuration.'
  - question: What is the difference between desired state and live state in ArgoCD?
    answer: 'Desired state is the Kubernetes configuration declared in the configured Git repository. Live state represents the resources that currently exist in the target Kubernetes cluster.


      ArgoCD continuously compares these states. When they differ, the application becomes OutOfSync, allowing engineers to identify configuration drift and optionally synchronize the cluster back to the desired state.'
  - question: What is an ArgoCD Application?
    answer: 'An ArgoCD Application is a declarative definition that connects a source of Kubernetes configuration with a destination cluster and namespace. It tells ArgoCD what should be deployed and where.


      This abstraction allows ArgoCD to manage applications consistently across environments. An Application can point to plain manifests, Helm charts, Kustomize configurations, or other supported sources.'
  - question: What is automated synchronization in ArgoCD?
    answer: 'Automated synchronization allows ArgoCD to apply changes from the desired Git state to the Kubernetes cluster without requiring a manual sync operation.


      When a repository changes, ArgoCD detects the new desired state and can reconcile the cluster automatically. This supports continuous delivery while preserving Git as the source of truth.'
  - question: Why is drift detection important in GitOps?
    answer: 'Drift occurs when the live cluster differs from the configuration declared in Git. It can happen through manual changes, external controllers, emergency modifications, or configuration mistakes.


      Detecting drift improves operational consistency because engineers can identify changes that bypassed the intended deployment process. Depending on the design, ArgoCD can report or automatically correct that drift.'
- category: Python
  questions:
  - question: Why is Python commonly used in DevOps?
    answer: 'Python provides a readable syntax, extensive standard library, and a large ecosystem for APIs, cloud services, automation, data processing, and infrastructure tooling. It is therefore useful for both small scripts and larger automation systems.


      For a DevOps Engineer, Python is particularly valuable when shell scripting becomes difficult to maintain or when integrations require structured data, API clients, error handling, and reusable abstractions.'
  - question: What is the difference between a list, tuple, and dictionary?
    answer: 'A list is an ordered, mutable collection. A tuple is an ordered collection that is immutable after creation. A dictionary stores key-value pairs and provides efficient access through keys.


      Choosing the appropriate structure improves code clarity and correctness. Lists are useful for collections that change, tuples for fixed groups of values, and dictionaries for representing structured mappings or configuration data.'
  - question: Why are exceptions important in Python automation?
    answer: 'Exceptions provide a structured mechanism for handling failures without relying only on return codes or manually checking every operation. Code can raise an exception when an operation cannot be completed and handle it at an appropriate level.


      Reliable automation should distinguish expected failures from unexpected ones, log useful context, and return meaningful exit status or results. Silently ignoring exceptions can create dangerous infrastructure automation.'
  - question: What is a virtual environment in Python?
    answer: 'A virtual environment isolates Python packages for a particular project. It prevents dependencies installed for one project from interfering with dependencies required by another project.


      This improves reproducibility and dependency management. In DevOps automation, isolated environments make it easier to build predictable tooling and avoid problems caused by incompatible versions installed globally.'
  - question: What is the purpose of modules and packages in Python?
    answer: 'A module is typically a Python file containing reusable code, while a package organizes related modules into a structured namespace. They allow applications to separate responsibilities instead of placing everything into one script.


      For automation projects, this separation improves maintainability, testing, and reuse. Functions related to AWS, Kubernetes, configuration, or command execution can be isolated into appropriate modules.'
- category: Shell Script
  questions:
  - question: Why is shell scripting useful for DevOps Engineers?
    answer: 'Shell scripts provide a direct way to automate operating-system commands, process files, manage processes, and combine existing Unix tools. They are particularly effective for simple operational tasks and command-line workflows.


      However, shell becomes harder to maintain as logic grows. A good DevOps Engineer should recognize when a task is naturally suited to shell and when Python or another language provides safer structure and better maintainability.'
  - question: What is the purpose of `set -euo pipefail`?
    answer: '`set -e` causes a script to stop when a command fails, `-u` treats references to undefined variables as errors, and `pipefail` causes a pipeline to fail when an intermediate command fails.


      Together, these options make scripts fail more predictably. They do not replace proper error handling, but they reduce common cases where a script silently continues after an unexpected failure.'
  - question: What is the difference between `$?` and `$!`?
    answer: '`$?` contains the exit status of the most recently executed command. A value of zero normally indicates success, while a non-zero value indicates failure.


      `$!` contains the process ID of the most recently started background command. This is useful when a script starts asynchronous processes and needs to later wait for or inspect those processes.'
  - question: Why should shell variables usually be quoted?
    answer: 'Quoting variables prevents the shell from unexpectedly performing word splitting and pathname expansion on their contents. Without quotes, values containing spaces or wildcard characters can be interpreted differently than intended.


      For example, using `"$file"` is generally safer than `$file` when handling paths or user-provided values. Proper quoting is an important defensive practice in shell automation.'
  - question: What is the difference between a process and a command in shell scripting?
    answer: 'A command is an instruction executed by the shell, while a process is a running instance of a program. Executing a command can result in a new process, but shell built-ins may execute directly within the shell process.


      Understanding this distinction is useful when managing background jobs, signals, process IDs, and resource consumption. It also helps explain how shell scripts interact with the operating system.'
- category: GO
  questions:
  - question: Why is Go commonly used for infrastructure tooling?
    answer: 'Go provides compiled binaries, strong concurrency primitives, static typing, and a relatively simple language. A program can often be distributed as a single binary without requiring a runtime environment.


      These characteristics make Go well suited for infrastructure and cloud-native tooling. Many Kubernetes ecosystem projects use Go because it provides efficient execution, portability, and strong support for concurrent network-oriented workloads.'
  - question: What are goroutines in Go?
    answer: 'A goroutine is a lightweight concurrent function managed by the Go runtime. It allows a program to perform multiple operations concurrently without requiring a traditional operating-system thread for every task.


      Goroutines are useful for infrastructure tools that perform many independent operations, such as API requests or monitoring tasks. However, concurrency still requires careful synchronization to avoid races and inconsistent shared state.'
  - question: What is a Go interface?
    answer: 'An interface defines a set of methods that a type must implement. A type satisfies an interface implicitly by providing those methods, without explicitly declaring that it implements the interface.


      This enables components to depend on behavior rather than concrete implementations. In infrastructure code, interfaces are particularly useful for testing, abstraction, and replacing external systems with mock implementations.'
  - question: How does error handling work in Go?
    answer: 'Go commonly represents errors as returned values rather than using exceptions for normal error handling. Functions frequently return both a result and an error, allowing callers to explicitly decide how to handle failure.


      This makes error paths visible in the code. For DevOps tooling, explicit error handling is valuable because failures involving APIs, files, processes, and infrastructure should generally be handled rather than silently ignored.'
  - question: What is the purpose of `defer` in Go?
    answer: '`defer` schedules a function call to execute when the surrounding function returns. It is commonly used for cleanup operations such as closing files, releasing resources, or unlocking a mutex.


      Using `defer` keeps cleanup close to the resource acquisition logic. This reduces the chance of forgetting cleanup when a function has multiple return paths caused by errors or conditional execution.'
- category: Linux
  questions:
  - question: What is the Linux process model?
    answer: 'In Linux, running programs execute as processes, each with an identifier called a PID. Processes have attributes such as ownership, environment, file descriptors, resource limits, and relationships with other processes.


      Understanding processes is fundamental for DevOps troubleshooting. Tools such as `ps`, `top`, `kill`, and `strace` allow engineers to inspect process behavior, resource usage, signals, and system interactions.'
  - question: What are file descriptors in Linux?
    answer: 'A file descriptor is a numeric reference to an open resource used by a process. Standard descriptors include stdin, stdout, and stderr, while files, sockets, pipes, and other resources can also be represented by descriptors.


      This abstraction allows Linux programs to interact with many resources through consistent interfaces. Understanding file descriptors is particularly important when debugging logs, pipelines, network services, and redirected output.'
  - question: What is the Linux permission model?
    answer: 'Linux permissions determine who can read, write, or execute a filesystem object. Traditional permissions are divided between the owner, group, and others, while additional mechanisms such as ACLs provide more granular control.


      Permissions are a fundamental security boundary for Linux workloads. DevOps Engineers should understand ownership, modes, groups, and privilege escalation because many container and server security issues involve incorrect filesystem permissions.'
  - question: What is the difference between a process and a thread in Linux?
    answer: 'A process provides an execution environment with its own virtual memory space and system resources. Threads are execution units within a process and share resources such as memory and file descriptors.


      Threads are generally cheaper to create and communicate through shared memory, but that sharing introduces synchronization concerns. Understanding both concepts helps when troubleshooting application performance and resource consumption.'
  - question: What is the Linux kernel responsible for?
    answer: 'The Linux kernel is the core component that manages hardware and provides fundamental services to user-space programs. It handles processes, memory, networking, storage, devices, scheduling, and system calls.


      Applications normally interact with these capabilities through system calls rather than directly controlling hardware. For DevOps Engineers, understanding this boundary helps explain container isolation, resource limits, networking, and system-level troubleshooting.'
