<!DOCTYPE <!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>DevOps flash cards</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="terminal">
            <section id="window-header">
                <p>DevOps flash cards</p>
            </section>
            
            <section class="screen" id="page-categories-section">
                <!-- Elements will be added here via JS -->
                <div id="page-categories-field"></div>
            </section>

            <section class="screen" id="filters-section">
                <button id="all-btn">All</button>
                <!-- Elements will be added here via JS -->
                <div id="filters-field"></div>
            </section>
            


            <section class="screen" id="questions-section">
                <div id="ps-section">
                    <p><span id="ps-text">~/ </span><span id="sep"> $ </span><span id="question-category">Reading...</span></p>
                </div>
                <div>
                    <div id="question-panel">
                        <p>$ question</p>
                        <!-- The content will be create here via JS -->
                        <span id="question-ask-field">Reading...</span>
                    </div>
                    <div id="answer-panel">
                        <p>$ answer</p>
                        <!-- The content will be create here via JS -->
                        <span id="question-answer-field">Reading...</span>
                    </div>
                </div>
                <div>
                    <p>Selected categories: <span id="total-categories-quantity">Reading...</span></p>
                    <p>Total questions: <span id="total-questions-quantity">Reading...</span></p>
                </div>
                <div>
                    <button id="reveal-question-btn">Reveal answer</button>
                    <button id="next-question-btn">Next question</button>
                </div>
            </section>
        </main>
        
        <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
        <script src="js/main.js" type="module"></script>
    </body>
</html>
